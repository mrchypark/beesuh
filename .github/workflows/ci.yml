name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-ref:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and resolve release tag
        id: resolve
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: sh
        run: |
          set -eu
          test "${#RELEASE_TAG}" -le 128
          printf '%s\n' "$RELEASE_TAG" | LC_ALL=C grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  go:
    needs: release-ref
    name: go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-ref.outputs.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -timeout 900s ./...
      - name: go test (race)
        run: go test -race -count=1 -timeout 1200s ./...
      - name: Darwin arm64 without CGo
        shell: sh
        run: |
          set -eu
          work=$(mktemp -d "$RUNNER_TEMP/beesuh-darwin.XXXXXXXX")
          trap 'rm -rf "$work"' EXIT
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o "$work/beesuh" ./cmd/beesuh
      - name: Rhiza v0.22.0 negative control and v0.23.0 retained data
        shell: sh
        run: |
          set -eu
          work=$(mktemp -d "$RUNNER_TEMP/beesuh-rhiza-upgrade.XXXXXXXX")
          trap 'rm -rf "$work"' EXIT
          cp go.mod "$work/baseline.mod"
          cp go.sum "$work/baseline.sum"
          go mod edit -modfile="$work/baseline.mod" -require=github.com/mrchypark/rhiza@v0.22.0
          go mod download -modfile="$work/baseline.mod" github.com/mrchypark/rhiza
          cp go.mod "$work/seed.mod"
          cp go.sum "$work/seed.sum"
          go mod edit -modfile="$work/seed.mod" -require=github.com/mrchypark/rhiza@v0.23.0
          go mod download -modfile="$work/seed.mod" github.com/mrchypark/rhiza
          baseline=$(go list -mod=readonly -modfile="$work/baseline.mod" -m -f '{{.Version}}' github.com/mrchypark/rhiza)
          seed=$(go list -mod=readonly -modfile="$work/seed.mod" -m -f '{{.Version}}' github.com/mrchypark/rhiza)
          candidate=$(go list -mod=readonly -m -f '{{.Version}}' github.com/mrchypark/rhiza)
          printf 'Rhiza negative-control=%s seed=%s verify=%s\n' "$baseline" "$seed" "$candidate"
          test "$baseline" = v0.22.0
          test "$seed" = v0.23.0
          test "$candidate" = v0.23.1
          baseline_status=0
          go test -mod=readonly -modfile="$work/baseline.mod" -count=1 -timeout 120s -v \
            -run '^TestRhizaQueryCancellationKeepsHTTPCategory$' ./httpapi \
            >"$work/baseline-query.log" 2>&1 || baseline_status=$?
          cat "$work/baseline-query.log"
          test "$baseline_status" -eq 1
          for mode in deadline cancel; do
            grep -F -- "--- FAIL: TestRhizaQueryCancellationKeepsHTTPCategory/$mode (" "$work/baseline-query.log"
          done
          test "$(grep -c 'Query lost context cause:' "$work/baseline-query.log")" -eq 2
          go test -mod=readonly -modfile="$work/seed.mod" -c -o "$work/seed.test" .
          BEESUH_RECOVERY_SEED_BINARY="$work/seed.test" go test -mod=readonly -count=1 -timeout 120s -v -run '^TestSingleNodeDurableRecovery$' .

  opencode-plugin:
    needs: release-ref
    name: opencode plugin (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-ref.outputs.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
      - name: bun test
        working-directory: examples/opencode
        run: bun test

  docker-check:
    needs: release-ref
    name: docker build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-ref.outputs.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: beesuh:smoke
          platforms: linux/amd64
          cache-from: type=gha,scope=beesuh-build
          cache-to: type=gha,mode=max,scope=beesuh-build
      - name: Container smoke test
        env:
          TMPDIR: ${{ runner.temp }}
        run: sh scripts/smoke-container.sh beesuh:smoke
      - name: Preserve failed smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-smoke-logs
          path: |
            ${{ runner.temp }}/beesuh-smoke.*/*.log
            ${{ runner.temp }}/beesuh-smoke.*/logs/*.log
          if-no-files-found: ignore

  docker-publish:
    needs: [release-ref, go, opencode-plugin, docker-check]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-ref.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/mrchypark/beesuh:${{ needs.release-ref.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/mrchypark/beesuh
          cache-from: type=gha,scope=beesuh-build
          cache-to: type=gha,mode=max,scope=beesuh-build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify the published image by digest
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
          TMPDIR: ${{ runner.temp }}
        shell: sh
        run: |
          set -eu
          test "${#PUBLISHED_DIGEST}" -eq 71
          printf '%s\n' "$PUBLISHED_DIGEST" | LC_ALL=C grep -Eq '^sha256:[0-9a-f]{64}$'
          image="ghcr.io/mrchypark/beesuh@$PUBLISHED_DIGEST"
          docker pull --platform linux/amd64 "$image"
          sh scripts/smoke-container.sh "$image"
      - name: Preserve failed published-image smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: published-image-smoke-logs
          path: |
            ${{ runner.temp }}/beesuh-smoke.*/*.log
            ${{ runner.temp }}/beesuh-smoke.*/logs/*.log
          if-no-files-found: ignore
