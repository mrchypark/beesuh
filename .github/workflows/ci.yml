name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -timeout 900s ./...
      - name: go test (race)
        run: go test -race -count=1 -timeout 1200s ./...

  opencode-plugin:
    name: opencode plugin (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun test
        working-directory: examples/opencode
        run: bun test

  docker-check:
    name: docker build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: beesuh:smoke
          platforms: linux/amd64
          cache-from: type=gha,scope=beesuh-build
          cache-to: type=gha,mode=max,scope=beesuh-build
      - name: Container smoke test
        run: sh scripts/smoke-container.sh beesuh:smoke

  docker-publish:
    needs: [go, opencode-plugin, docker-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mrchypark/beesuh:latest
            ghcr.io/mrchypark/beesuh:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/mrchypark/beesuh
          cache-from: type=gha,scope=beesuh-build
          cache-to: type=gha,mode=max,scope=beesuh-build
